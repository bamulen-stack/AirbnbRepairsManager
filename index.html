<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<title>Airbnb Repairs Manager v9.20 Routine Search Groups</title>
<style>
:root{
  --blue:#0b63ce;--blue2:#0a4fa8;--light:#eef6ff;--bg:#f5f7fb;--card:#fff;
  --text:#172033;--muted:#6d7890;--line:#e4e9f0;--green:#16a36a;--orange:#e88622;--red:#d84b4b;
  --shadow:0 8px 24px rgba(25,51,85,.10)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{padding-bottom:86px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-header{
  background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;
  padding:20px 18px 22px;border-radius:0 0 26px 26px;box-shadow:var(--shadow);
  position:sticky;top:0;z-index:20
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand small{display:block;opacity:.8;font-size:11px;font-weight:800;letter-spacing:.12em}
.brand h1{margin:3px 0 0;font-size:24px}
.icon-btn{
  width:46px;height:46px;border:0;border-radius:15px;background:#fff;color:var(--blue);
  font-size:26px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.13)
}
.container{padding:16px;max-width:760px;margin:auto}
.hero{
  background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:-2px
}
.hero .today{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.hero strong{font-size:36px;color:var(--blue)}
.hero .sub{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border-radius:17px;padding:13px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.section-head h2{margin:0;font-size:18px}
.small-btn,.btn{
  border:0;border-radius:12px;padding:10px 13px;font-weight:800
}
.small-btn{font-size:12px}
.primary{background:var(--blue);color:#fff}
.soft{background:var(--light);color:var(--blue)}
.danger{background:#ffeded;color:#b72e2e}
.card{
  background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)
}
.card-title{font-weight:900;font-size:16px}
.muted{color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:10px}
.space{justify-content:space-between}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#eaf2ff;color:var(--blue)}
.badge.done{background:#e2f7ec;color:#14794f}
.badge.progress{background:#fff1df;color:#a85f12}
.badge.urgent{background:#ffe6e6;color:#b72e2e}
.badge.high{background:#fff1df;color:#a85f12}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:7px 4px calc(8px + env(safe-area-inset-bottom))
}
.nav{border:0;background:none;color:#8993a7;padding:4px 0;font-size:11px}
.nav .ico{display:block;font-size:22px;line-height:22px;margin-bottom:3px}
.nav.active{color:var(--blue);font-weight:900}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.empty{background:#fff;border:1px dashed #cfd6e1;border-radius:17px;padding:26px 16px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(12,25,45,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:90vh;border-radius:24px 24px 0 0;padding:18px;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2{margin:0;font-size:21px}
.close{border:0;background:#eef2f7;border-radius:12px;width:40px;height:40px;font-size:20px}
.form{display:grid;gap:12px}
.form.two{grid-template-columns:1fr 1fr}
label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#43506a}
input,select,textarea{
  width:100%;border:1px solid #d8deea;border-radius:13px;padding:12px;background:#fff;color:var(--text)
}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{padding:12px 16px}
.code{font-family:ui-monospace,monospace;background:#132238;color:#fff;padding:5px 8px;border-radius:8px;display:inline-block}
.detail-grid{display:grid;gap:8px;margin-top:10px}
.detail-line{background:#f7f9fc;border-radius:12px;padding:10px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.top-spacer{height:2px}
@media(max-width:430px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{padding:11px}.stat b{font-size:20px}.form.two{grid-template-columns:1fr}
}

.photo-section{margin-top:18px}
.photo-tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 10px}
.photo-tab{border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;background:#edf3fb;color:#607089;white-space:nowrap}
.photo-tab.active{background:var(--blue);color:#fff}
.photo-thumb{position:relative}
.photo-thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;box-shadow:var(--shadow)}
.photo-delete{position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-weight:900}
.photo-label{position:absolute;left:5px;bottom:5px;border-radius:999px;padding:3px 6px;font-size:9px;font-weight:900;background:rgba(255,255,255,.92);color:#24324a}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}


.urgent-card{border-left:5px solid var(--red)}
.health-card{border-left:5px solid var(--orange)}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.template-btn{border:1px solid #dfe7f2;background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800;color:#23314b}
.template-btn small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
.report{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.report-table{width:100%;border-collapse:collapse;margin-top:10px}
.report-table td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.month-total{font-size:28px;font-weight:900;color:var(--blue)}
@media print{
  body{background:#fff;padding:0}.app-header,.bottom-nav,.no-print{display:none!important}
  .container{max-width:none;padding:0}.report{box-shadow:none;border-radius:0}
}
</style>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.quick-action{border:0;border-radius:18px;padding:14px 10px;background:#eaf3ff;color:#0b63ce;font-weight:800;font-size:15px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:10px 0}
.filters select{min-width:135px;border:1px solid #d8e0ea;border-radius:14px;padding:10px;background:#fff}
.pin-btn{border:0;background:transparent;font-size:22px;padding:4px 8px}
.task-mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.task-mini button{border:0;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800}
.task-pending{background:#fff4d6;color:#805d00}.task-progress{background:#dff0ff;color:#075c9e}.task-done{background:#dcfce7;color:#166534}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.summary-box{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:14px}
.summary-box b{display:block;font-size:24px}.summary-box span{font-size:13px;color:#778296}
.photo-date{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;padding:3px 6px;border-radius:8px;font-size:10px}
.qr-card{text-align:center}.qr-card img{width:220px;max-width:80%;image-rendering:pixelated;border-radius:12px;background:white;padding:8px}
</style>

<style>
.inspection-section{margin:14px 0}
.inspection-item{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin:10px 0}
.inspection-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inspection-status{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.inspection-status button{border:0;border-radius:999px;padding:8px 11px;font-weight:800;font-size:12px}
.inspection-status .ok{background:#dcfce7;color:#166534}
.inspection-status .problem{background:#fee2e2;color:#b91c1c}
.inspection-status .na{background:#eef2f7;color:#556070}
.inspection-note{margin-top:8px}
.inspection-note textarea{width:100%;min-height:70px}
.inspection-problem{border-left:5px solid #dc2626}
.inspection-ok{border-left:5px solid #16a34a}
.inspection-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inspection-summary .box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;text-align:center}
.inspection-summary b{display:block;font-size:22px}
.inspection-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>

<style>
.safe-banner{background:#e9f7ef;border:1px solid #b7e4c7;border-radius:18px;padding:14px;margin-bottom:14px}
.safe-banner b{display:block;margin-bottom:4px}
.safe-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.safe-status{font-size:12px;color:#667085;margin-top:8px}
</style>

<style>
/* V9.2 dashboard color system */
.stat-open{background:#eaf3ff!important;border:1px solid #b9d7ff!important}
.stat-open b,.stat-open span{color:#0b63ce!important}
.stat-overdue{background:#fff2df!important;border:1px solid #ffd29a!important}
.stat-overdue b,.stat-overdue span{color:#c66a00!important}
.stat-urgent{background:#feecec!important;border:1px solid #f6bcbc!important}
.stat-urgent b,.stat-urgent span{color:#c62828!important}

.summary-tasks{background:#eef5ff!important;border-color:#cbdcff!important}
.summary-tasks b,.summary-tasks span{color:#315f9b!important}
.summary-completed{background:#ecf9f0!important;border-color:#bfe5c8!important}
.summary-completed b,.summary-completed span{color:#238636!important}
.summary-costs{background:#edf8f3!important;border-color:#c2e6d6!important}
.summary-costs b,.summary-costs span{color:#13795b!important}
.summary-quotes{background:#f5efff!important;border-color:#dcc8ff!important}
.summary-quotes b,.summary-quotes span{color:#6f42c1!important}

.urgent-card{
  background:#fff1f1!important;
  border:1px solid #f3b6b6!important;
  border-left:6px solid #dc2626!important;
}
.urgent-card .card-title{color:#a61b1b!important}
.urgent-card:before{
  content:"URGENT";
  display:inline-block;
  margin-bottom:8px;
  padding:4px 8px;
  border-radius:999px;
  background:#dc2626;
  color:white;
  font-size:11px;
  font-weight:900;
  letter-spacing:.4px;
}
.today-accent{
  background:#eef7ff;
  border:1px solid #cfe4fb;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
}
.today-accent h2{color:#0b63ce;margin:0}
.section-head.urgent-head h2{color:#b91c1c}
</style>

<style>
.dashboard-link{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.dashboard-link:active{transform:scale(.97)}
.dashboard-link:focus{outline:3px solid rgba(11,99,206,.22);outline-offset:2px}
.dashboard-link .tap-hint{font-size:11px;opacity:.72;margin-top:5px;font-weight:700}
</style>

<style>
.completed-month{background:#fff;border:1px solid #dfe7ef;border-radius:18px;margin:10px 0;overflow:hidden}
.completed-month summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px}
.completed-month summary::-webkit-details-marker{display:none}
.completed-month summary:after{content:"▾";font-size:18px;color:#64748b}
.completed-month[open] summary:after{content:"▴"}
.completed-month-count{background:#ecf9f0;color:#238636;padding:4px 9px;border-radius:999px;font-size:12px}
.completed-month-body{padding:0 12px 12px}
</style>

<style>
.building-card-inner{display:flex;align-items:center;gap:12px}
.building-photo{width:78px;height:78px;flex:0 0 78px;border-radius:14px;object-fit:cover;background:#eef3f8}
.building-main{min-width:0;flex:1}
.building-alert-dot{width:14px;height:14px;border-radius:50%;background:#dc2626;box-shadow:0 0 0 3px #fee2e2;display:inline-block}
.building-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.building-mini{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#315f9b}
.building-mini.open{background:#ecf9f0;color:#238636}
.building-mini.inspection{background:#feecec;color:#b91c1c}
</style>

<style>
.daily-report-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.daily-report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.daily-report-summary .box{border:1px solid #dfe7ef;border-radius:14px;padding:10px;text-align:center;background:#f8fbff}
.daily-report-summary b{display:block;font-size:22px;color:#0b63ce}
.daily-report-section{margin-top:22px}
.daily-report-item{border:1px solid #dfe7ef;border-radius:16px;padding:14px;margin:10px 0;break-inside:avoid}
.daily-report-item h3{margin:0 0 6px;font-size:17px}
.daily-report-meta{color:#667085;font-size:13px;line-height:1.45}
.daily-report-badges{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.daily-report-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.daily-report-photos img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.daily-report-problem{border-left:5px solid #dc2626}
.report-date-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.report-date-picker input{padding:10px 12px;border:1px solid #d8e0ea;border-radius:12px;background:#fff}
@media print{
  .daily-report-photos img{height:125px}
  .daily-report-item{box-shadow:none}
}
</style>

<style>
.inspection-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.inspection-photo{position:relative}
.inspection-photo img{width:100%;height:150px;object-fit:cover;border-radius:12px;display:block}
.inspection-photo-del{position:absolute;right:6px;top:6px;border:0;background:rgba(0,0,0,.65);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:800}
</style>

<style>
.daily-report-actions,.daily-report-actions *{pointer-events:auto!important}
.daily-report-actions button{touch-action:manipulation}
</style>

<style>
.client-report{max-width:820px;margin:0 auto;background:#fff;border-radius:18px;padding:22px}
.client-report-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #0b63ce;padding-bottom:16px;margin-bottom:18px}
.client-brand{font-size:26px;font-weight:900;color:#0b63ce;letter-spacing:.4px}
.client-sub{color:#64748b;font-size:13px;margin-top:3px}
.client-report h2{margin:20px 0 10px}
.client-kv{width:100%;border-collapse:collapse}
.client-kv td{padding:8px 6px;border-bottom:1px solid #e5e7eb;vertical-align:top}
.client-kv td:first-child{font-weight:800;width:34%;color:#334155}
.client-signatures{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:38px}
.client-sign-line{border-top:1px solid #64748b;padding-top:7px;text-align:center;color:#64748b;font-size:13px}
.client-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.client-photo-grid img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.client-problem{border-left:5px solid #dc2626;background:#fff7f7;border-radius:12px;padding:12px;margin:10px 0}
</style>

<style>
.ba-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ba-panel{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:10px}
.ba-panel h3{margin:0 0 8px;font-size:14px}
.ba-panel img{width:100%;height:220px;object-fit:cover;border-radius:12px;display:block}
.route-step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #dfe7ef;border-radius:18px;padding:14px;margin:10px 0}
.route-num{width:36px;height:36px;border-radius:50%;background:#0b63ce;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 36px}
.route-main{flex:1;min-width:0}
.route-task{padding:8px 0;border-top:1px solid #eef2f7}
.route-task:first-of-type{border-top:0}
.recur-badge{display:inline-block;background:#eef5ff;color:#315f9b;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;margin-top:6px}
</style>

<style>
.routine-card{border-left:5px solid #0b63ce}
.routine-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.routine-item{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:14px}
.routine-due{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}
.routine-ok{background:#e7f7ee;color:#16734c}
.routine-soon{background:#fff4d8;color:#9a6500}
.routine-overdue{background:#ffe7e7;color:#b72e2e}
.routine-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;margin-left:7px;vertical-align:middle}
</style>

<style>
.routine-toolbar{position:sticky;top:88px;z-index:8;background:var(--bg);padding:8px 0 10px}
.routine-search{width:100%;border:1px solid #d8deea;border-radius:14px;padding:12px 14px;background:#fff}
.routine-filter-row{display:flex;gap:8px;overflow:auto;padding:8px 0 2px}
.routine-filter-btn{white-space:nowrap;border:0;border-radius:999px;padding:8px 12px;font-weight:800;background:#eef4fb;color:#315f9b}
.routine-filter-btn.active{background:#0b63ce;color:#fff}
.routine-building{margin:12px 0}
.routine-building-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.routine-building-head h3{margin:0;font-size:18px}
.routine-building-body{padding-top:10px}
.routine-apartment{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:14px;margin-bottom:10px}
.routine-apartment-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.routine-apartment-title{font-weight:900}
.routine-count{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div class="brand"><small>AIRBNB MAINTENANCE</small><h1 id="pageTitle">Dashboard</h1></div>
    <button class="icon-btn" id="quickAdd">+</button>
  </div>
</header>

<main class="container" id="view"></main>

<nav class="bottom-nav">
  <button class="nav active" data-route="home"><span class="ico">⌂</span>Home</button>
  <button class="nav" data-route="calendar"><span class="ico">▦</span>Calendar</button>
  <button class="nav" data-route="properties"><span class="ico">▣</span>Properties</button>
  <button class="nav" data-route="tasks"><span class="ico">✓</span>Tasks</button>
  <button class="nav" data-route="finance"><span class="ico">€</span>Quotes</button>
  <button class="nav" data-route="more"><span class="ico">•••</span>More</button>
</nav>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><h2 id="sheetTitle">Add</h2><button class="close" onclick="closeSheet()">✕</button></div>
    <form id="sheetForm">
      <div id="sheetBody"></div>
      <div class="actions">
        <button type="button" class="btn soft" onclick="closeSheet()">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<input id="photoGalleryInput" type="file" accept="image/*" multiple hidden>
<input id="photoCameraInput" type="file" accept="image/*" capture="environment" hidden>

<div class="overlay" id="photoViewer" style="align-items:center;padding:18px">

const MGV_DELETED_BUILDINGS_KEY='mgv_deleted_buildings_v1';
const MGV_DELETED_APARTMENTS_KEY='mgv_deleted_apartments_v1';
function getDeletedMGVBuildings(){try{return JSON.parse(localStorage.getItem(MGV_DELETED_BUILDINGS_KEY)||'[]')}catch(e){return[]}}
function getDeletedMGVApartments(){try{return JSON.parse(localStorage.getItem(MGV_DELETED_APARTMENTS_KEY)||'[]')}catch(e){return[]}}
function rememberDeletedMGVBuilding(id){
  if(!String(id||'').startsWith('mgv-b-'))return;
  const a=getDeletedMGVBuildings();if(!a.includes(id)){a.push(id);localStorage.setItem(MGV_DELETED_BUILDINGS_KEY,JSON.stringify(a))}
}
function rememberDeletedMGVApartment(id){
  if(!String(id||'').startsWith('mgv-'))return;
  const a=getDeletedMGVApartments();if(!a.includes(id)){a.push(id);localStorage.setItem(MGV_DELETED_APARTMENTS_KEY,JSON.stringify(a))}
}

function ensureMGVSeed(d){
  d.buildings=d.buildings||[];d.apartments=d.apartments||[];
  if((d.mgvSeedVersion||0)>=MGV_SEED_VERSION)return d;
  const bIds=new Set(d.buildings.map(x=>x.id));
  const deletedB=new Set(getDeletedMGVBuildings());
  MGV_BUILDINGS.forEach(x=>{if(!bIds.has(x.id)&&!deletedB.has(x.id))d.buildings.push({...x})});
  const aIds=new Set(d.apartments.map(x=>x.id));
  const deletedA=new Set(getDeletedMGVApartments());
  MGV_APARTMENTS.forEach(x=>{if(!aIds.has(x.id)&&!deletedA.has(x.id))d.apartments.push({...x})});
  d.mgvSeedVersion=MGV_SEED_VERSION;
  try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
  return d;
}

function ensureCodesImport(d){
 d.buildings=d.buildings||[];d.apartments=d.apartments||[];
 if((d.codesImportVersion||0)>=CODES_IMPORT_VERSION)return d;
 Object.entries(CODES_BUILDING_ACCESS).forEach(([bid,c])=>{
   let b=d.buildings.find(x=>x.id===bid);
   if(b){if(c.keypad)b.entranceCode=c.keypad;if(c.lockbox){let s='Building lockbox code: '+c.lockbox;if(!(b.accessNotes||'').includes(s))b.accessNotes=((b.accessNotes||'')?b.accessNotes+' • ':'')+s;}}
 });
 const bIds=new Set(d.buildings.map(x=>x.id));
 CODES_BUILDINGS.forEach(x=>{if(!bIds.has(x.id))d.buildings.push({...x})});
 const covered=new Set(CODES_APARTMENTS.map(x=>x.buildingId));
 const taskApts=new Set((d.tasks||[]).map(t=>t.apartmentId));
 d.apartments=d.apartments.filter(a=>{
   if(!covered.has(a.buildingId)||taskApts.has(a.id))return true;
   const n=(a.notes||'').toLowerCase();
   return !(String(a.id).startsWith('mgv-')&&(n.includes('imported from')||n.includes('official the edge')));
 });
 const aIds=new Set(d.apartments.map(x=>x.id));
 CODES_APARTMENTS.forEach(x=>{if(!aIds.has(x.id))d.apartments.push({...x})});
 d.codesImportVersion=CODES_IMPORT_VERSION;
 try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
 return d;
}


const SAFE_DB_NAME='AirbnbRepairsSafeDB';
const SAFE_DB_STORE='snapshots';
const SAFE_DB_KEY='latest';
let safeFileHandle=null;
let safeWriteTimer=null;

function openSafeDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(SAFE_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(SAFE_DB_STORE))db.createObjectStore(SAFE_DB_STORE)};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function saveToIndexedDB(payload){
  try{
    const db=await openSafeDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(SAFE_DB_STORE,'readwrite');
      tx.objectStore(SAFE_DB_STORE).put(payload,SAFE_DB_KEY);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function loadFromIndexedDB(){
  try{
    const db=await openSafeDB();
    const value=await new Promise((resolve,reject)=>{
      const tx=db.transaction(SAFE_DB_STORE,'readonly');
      const req=tx.objectStore(SAFE_DB_STORE).get(SAFE_DB_KEY);
      req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
    });
    db.close();return value;
  }catch(e){return null}
}
function safePayload(){
  return {app:'Airbnb Repairs Manager',backupVersion:3,createdAt:new Date().toISOString(),data:data};
}
async function saveExternalBackupNow(){
  if(!safeFileHandle)return false;
  try{
    if(safeFileHandle.queryPermission){
      let perm=await safeFileHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'&&safeFileHandle.requestPermission)perm=await safeFileHandle.requestPermission({mode:'readwrite'});
      if(perm!=='granted')return false;
    }
    const writable=await safeFileHandle.createWritable();
    await writable.write(JSON.stringify(safePayload()));
    await writable.close();
    localStorage.setItem('airbnb_safe_external_last',new Date().toISOString());
    updateSafeStatus();
    return true;
  }catch(e){return false}
}
function scheduleExternalBackup(){
  if(!safeFileHandle)return;
  clearTimeout(safeWriteTimer);
  safeWriteTimer=setTimeout(()=>saveExternalBackupNow(),500);
}
async function chooseSafetyBackupFile(){
  if(!window.showSaveFilePicker){
    alert('Automatic external backup is not supported by this browser. Use “Download Backup” after important changes.');
    return;
  }
  try{
    safeFileHandle=await window.showSaveFilePicker({
      suggestedName:'airbnb-repairs-SAFE-backup.json',
      types:[{description:'JSON Backup',accept:{'application/json':['.json']}}]
    });
    await saveExternalBackupNow();
    alert('Safety backup file connected. While this permission remains active, changes will also be written to that external file.');
  }catch(e){}
}
async function restoreFromSafetyFile(){
  if(window.showOpenFilePicker){
    try{
      const [fh]=await window.showOpenFilePicker({multiple:false,types:[{description:'JSON Backup',accept:{'application/json':['.json']}}]});
      const file=await fh.getFile(); importBackup(file);

  }

}
function updateSafeStatus(){
  const el=document.getElementById('safeStatus');if(!el)return;
  const last=localStorage.getItem('airbnb_safe_external_last');
  el.textContent=safeFileHandle?'External safety file connected'+(last?' • last write '+new Date(last).toLocaleString():''):'External safety file not connected';
}
function downloadSafetyBackup(){
  let payload=safePayload();
  let blob=new Blob([JSON.stringify(payload)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='airbnb-repairs-SAFE-'+today()+'.json';

}
async function initializeSafeData(){
  // Normal updates keep data in localStorage. IndexedDB is an additional mirror.
  // If localStorage is unexpectedly empty but IndexedDB still exists, recover from it.
  try{
    const localRaw=localStorage.getItem(KEY);
    const dbPayload=await loadFromIndexedDB();
    if((!localRaw || localRaw==='null') && dbPayload && dbPayload.data){
      data=dbPayload.data;

      data.favorites=data.favorites||[];data.inspections=data.inspections||[];
      localStorage.setItem(KEY,JSON.stringify(data));
    }
    await saveToIndexedDB(safePayload());
  }catch(e){}
}

function favorites(){data.favorites=data.favorites||[];return data.favorites}
function isFavorite(id){return favorites().includes(id)}
function toggleFavorite(id){
  let f=favorites();data.favorites=f.includes(id)?f.filter(x=>x!==id):[...f,id];save();
  if(route==='properties')renderProperties();else showApartment(id);
}
function setTaskStatus(id,status){
  let t=data.tasks.find(x=>x.id===id);if(!t)return;
  t.status=status;if(status==='Completed')t.completedAt=Date.now();else delete t.completedAt;
  save(); if(route==='tasks')renderTasks(); else if(route==='home')renderHome(); else showTask(id);
}
function taskMatches(t,q){
  let a=apt(t.apartmentId),b=a?.buildingId?bld(a.buildingId):null;
  return [t.title,t.description,t.problemTag,t.category,t.status,t.assignedTo,t.notes,a?.name,a?.address,b?.name].join(' ').toLowerCase().includes((q||'').toLowerCase());
}
function photoDate(p){return p?.createdAt?new Date(p.createdAt).toLocaleDateString():''}
function showApartmentQR(id){
  let a=apt(id);if(!a)return;let src=QR_MAP[id]||'';let url=location.origin+location.pathname+'?apt='+encodeURIComponent(id);
  let body=src?`<div class="qr-card"><img src="${src}" alt="QR"><p><b>${esc(a.name)}</b></p><p class="muted">Scan to open this apartment directly.</p><button type="button" class="btn soft" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}');alert('Link copied')">Copy link</button></div>`:
    `<div class="empty">QR image is available for imported apartments. For a newly-created apartment use Copy link.</div><button type="button" class="btn soft" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}');alert('Link copied')">Copy link</button>`;
  openSheet('Apartment QR',body,()=>{});document.querySelector('#sheetForm .actions').style.display='none';
}
function monthlyStats(){
  let m=today().slice(0,7),ts=data.tasks.filter(t=>(t.date||'').startsWith(m));
  let purchaseCost=(data.purchases||[]).filter(p=>{let t=data.tasks.find(x=>x.id===p.taskId);return t&&(t.date||'').startsWith(m)}).reduce((s,p)=>s+(Number(p.cost)||0),0);
  let taskCost=ts.reduce((s,t)=>s+(Number(t.cost)||0),0);
  let quotes=(data.quotations||[]).filter(q=>(q.date||'').startsWith(m));
  return {tasks:ts.length,completed:ts.filter(t=>t.status==='Completed').length,urgent:ts.filter(t=>t.priority==='Urgent').length,cost:taskCost+purchaseCost,quotes:quotes.length,quoteTotal:quotes.reduce((s,q)=>s+quoteTotal(q),0)};
}
function exportCsv(){
  const rows=[['Apartment','Building','Address','Floor','Task','Date','Status','Priority','Cost']];
  data.tasks.forEach(t=>{let a=apt(t.apartmentId),b=a?.buildingId?bld(a.buildingId):null;rows.push([a?.name||'',b?.name||'',a?.address||'',a?.floor||'',t.title||'',t.date||'',t.status||'',t.priority||'',t.cost||''])});
  let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  let blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='airbnb-repairs-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}



function newInspection(apartmentId){
  let a=apt(apartmentId);if(!a)return;
  let ins={id:id(),apartmentId,date:today(),createdAt:Date.now(),status:'Open',issues:[]};
  data.inspections=data.inspections||[];data.inspections.push(ins);save();showInspection(ins.id);
}
function inspectionById(i){return (data.inspections||[]).find(x=>x.id===i)}
function inspectionIssueCount(ins){return (ins.issues||[]).length}
function addInspectionIssue(insId){
  openSheet('Add Inspection Problem',
    `<div class="field"><label>Problem title</label><input name="title" required placeholder="e.g. Loose tap"></div>
     <div class="field"><label>Notes (optional)</label><textarea name="note" placeholder="Extra details..."></textarea></div>`,
    f=>{let ins=inspectionById(insId);if(!ins)return;ins.issues=ins.issues||[];ins.issues.push({id:id(),title:f.title||'',note:f.note||'',photoId:'',createdAt:Date.now()});}
  );
}
function editInspectionIssue(insId,issueId){
  let ins=inspectionById(insId),it=ins?.issues?.find(x=>x.id===issueId);if(!it)return;
  openSheet('Edit Inspection Problem',
    `<div class="field"><label>Problem title</label><input name="title" required value="${esc(it.title||'')}"></div>
     <div class="field"><label>Notes</label><textarea name="note">${esc(it.note||'')}</textarea></div>`,
    f=>{it.title=f.title||'';it.note=f.note||'';}
  );
}
function deleteInspectionIssue(insId,issueId){
  if(!confirm('Delete this problem?'))return;
  let ins=inspectionById(insId);if(!ins)return;
  let it=ins.issues.find(x=>x.id===issueId);
  let ids=it?inspectionIssuePhotoIds(it):[];
  if(ids.length)data.photos=(data.photos||[]).filter(p=>!ids.includes(p.id));
  ins.issues=ins.issues.filter(x=>x.id!==issueId);save();showInspection(insId);
}
function inspectionIssuePhotoIds(it){
  let ids=Array.isArray(it.photoIds)?[...it.photoIds]:[];
  if(it.photoId&&!ids.includes(it.photoId))ids.unshift(it.photoId);
  return ids;
}
async function saveInspectionIssuePhotoFiles(insId,issueId,files){
  let ins=inspectionById(insId),it=ins?.issues?.find(x=>x.id===issueId);if(!it)return;
  files=[...(files||[])].filter(Boolean);if(!files.length)return;
  data.photos=data.photos||[];
  it.photoIds=inspectionIssuePhotoIds(it);
  for(const file of files){
    try{
      const dataUrl=await resizeImage(file,1400,.78);
      let pid=id();
      data.photos.push({id:pid,inspectionId:insId,inspectionIssueId:issueId,type:'Inspection',dataUrl,name:file.name||'photo.jpg',createdAt:Date.now()});
      it.photoIds.push(pid);
    }catch(e){alert('Could not add one of the photos.');}
  }
  delete it.photoId;
  save();showInspection(insId);
}
function addInspectionIssueCamera(insId,issueId){
  let input=document.createElement('input');
  input.type='file';input.accept='image/*';input.capture='environment';
  input.onchange=()=>saveInspectionIssuePhotoFiles(insId,issueId,input.files);
  input.click();
}
function addInspectionIssueGallery(insId,issueId){
  let input=document.createElement('input');
  input.type='file';input.accept='image/*';input.multiple=true;
  input.onchange=()=>saveInspectionIssuePhotoFiles(insId,issueId,input.files);
  input.click();
}
function deleteInspectionIssuePhoto(insId,issueId,photoId){
  if(!confirm('Delete this photo?'))return;
  let ins=inspectionById(insId),it=ins?.issues?.find(x=>x.id===issueId);if(!it)return;

function buildDailyRoute(date=today()){
  const tasks=(data.tasks||[]).filter(t=>t.date===date&&t.status!=='Completed');
  const groups=new Map();
  tasks.forEach(t=>{
    const a=apt(t.apartmentId),b=a?.buildingId?bld(a.buildingId):null;
    const key=b?'b:'+b.id:'a:'+t.apartmentId;
    if(!groups.has(key))groups.set(key,{b,a,address:b?.address||a?.address||'',tasks:[]});
    groups.get(key).tasks.push(t);
  });
  const arr=[...groups.values()];
  arr.forEach(g=>g.tasks.sort((x,y)=>{
    const xu=x.priority==='Urgent',yu=y.priority==='Urgent';
    if(xu!==yu)return xu?-1:1;
    return (x.time||'99:99').localeCompare(y.time||'99:99');
  }));
  arr.sort((x,y)=>{
    const xu=x.tasks.some(t=>t.priority==='Urgent'),yu=y.tasks.some(t=>t.priority==='Urgent');
    if(xu!==yu)return xu?-1:1;
    const xt=x.tasks[0]?.time||'99:99',yt=y.tasks[0]?.time||'99:99';
    if(xt!==yt)return xt.localeCompare(yt);
    if(x.b&&y.b)return smartBuildingSort(x.b,y.b);
    return 0;
  });
  return arr;
}

function routineTaskFor(apartmentId,type){

    .sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))[0]||null;
}

  return (data.tasks||[]).filter(t=>t.apartmentId===apartmentId&&t.routineType===type&&t.status==='Completed')
    .sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))[0]||null;
}
function routineNextDue(task){
  if(!task)return '';
  if(task.status!=='Completed')return task.date||'';
  return nextRecurrenceDate(task.date,task.recurrence||'None');
}
function routineDueClass(date){
  if(!date)return 'routine-soon';
  if(date<today())return 'routine-overdue';
  const d=new Date(date+'T12:00:00'), n=new Date(today()+'T12:00:00');
  const days=Math.round((d-n)/86400000);
  return days<=14?'routine-soon':'routine-ok';
}
function routineDueText(date){
  if(!date)return 'Not scheduled';
  if(date<today())return 'Overdue • '+fmt(date);

    : {title:'Drain / Siphon Cleaning',category:'Plumbing',problemTag:'Routine Drains / Siphons',recurrence:'Monthly'};
  const t={id:id(),createdAt:Date.now(),apartmentId,date:today(),time:'',readyBy:'',priority:'Normal',status:'Pending',assignedTo:'',description:'',materials:'',cost:'',notes:'',routineType:type,...def};

function routineStatusFor(apartmentId,type){
  const t=routineLastCompleted(apartmentId,type)||routineTaskFor(apartmentId,type);
  const due=routineNextDue(t);
  if(!t)return 'not_scheduled';
  if(due&&due<today())return 'overdue';
  if(due){
    const d=new Date(due+'T12:00:00'),n=new Date(today()+'T12:00:00');
    const days=Math.round((d-n)/86400000);
    if(days<=14)return 'due_soon';
  }
  if(t.status==='Completed')return 'completed';
  return 'scheduled';
}

  if(filter==='favorites')return isFavorite(a.id);
  if(filter==='overdue')return ac==='overdue'||dr==='overdue';
  if(filter==='due_soon')return ac==='due_soon'||dr==='due_soon';
  if(filter==='not_scheduled')return ac==='not_scheduled'||dr==='not_scheduled';
  if(filter==='completed')return ac==='completed'&&dr==='completed';
  return true;
}

const BUILDING_PHOTOS={"Muses Residence": "https://mygreekvacations.com/images/projects/banners/a046aa4IMG_6462.jpg", "Olympus": "https://mygreekvacations.com/images/projects/banners/eec7d66Olympus%20Residence%20-%20Photo1.jpg", "Olympus Residence": "https://mygreekvacations.com/images/projects/banners/eec7d66Olympus%20Residence%20-%20Photo1.jpg", "Hercules Residence": "https://mygreekvacations.com/images/projects/banners/995d93dHercules_Residence_Photo4.jpg", "The Edge Luxury Residences": "https://www.theedgeluxuryresidences.gr/files/images/gallery/the-edge-luxury-residences-athens-1.jpg", "The Edge": "https://www.theedgeluxuryresidences.gr/files/images/gallery/the-edge-luxury-residences-athens-1.jpg"};
function buildingPhotoUrl(b){
  if(!b)return'';
  if(b.photoUrl)return b.photoUrl;
  if(BUILDING_PHOTOS[b.name])return BUILDING_PHOTOS[b.name];
  const name=(b.name||'').toLowerCase();
  for(const [k,v] of Object.entries(BUILDING_PHOTOS))if(name.includes(k.toLowerCase())||k.toLowerCase().includes(name))return v;
  return '';
}
function buildingInspectionInfo(buildingId){
  const apartmentIds=data.apartments.filter(a=>a.buildingId===buildingId).map(a=>a.id);
  const active=(data.inspections||[]).filter(i=>apartmentIds.includes(i.apartmentId)&&i.status!=='Completed'&&(i.issues||[]).length);
  const issueCount=active.reduce((n,i)=>n+(i.issues||[]).length,0);
  const aptCount=new Set(active.map(i=>i.apartmentId)).size;
  return {issueCount,aptCount,first:active[0]||null};
}


function recordVisit(kind,id){
  if(!id)return;
  data.visitHistory=data.visitHistory||{buildings:{},apartments:{}};
  data.visitHistory[kind]=data.visitHistory[kind]||{};
  let arr=data.visitHistory[kind][id]||[];
  arr.push(Date.now());
  data.visitHistory[kind][id]=arr.slice(-60);
  save();
}
function visitScore(kind,id){
  const arr=data.visitHistory?.[kind]?.[id]||[];
  const now=Date.now(), day=86400000;
  return arr.reduce((score,ts)=>{
    const age=Math.max(0,(now-Number(ts||0))/day);
    return score + Math.exp(-age/14);
  },0);
}
function smartBuildingSort(a,b){
  const diff=visitScore('buildings',b.id)-visitScore('buildings',a.id);
  if(Math.abs(diff)>.0001)return diff;
  return data.buildings.indexOf(a)-data.buildings.indexOf(b);
}
function smartApartmentSort(a,b){
  const fav=isFavorite(b.id)-isFavorite(a.id);
  if(fav)return fav;
  const diff=visitScore('apartments',b.id)-visitScore('apartments',a.id);
  if(Math.abs(diff)>.0001)return diff;
  return data.apartments.indexOf(a)-data.apartments.indexOf(b);
}

function completedMonthKey(t){
  const d=t.completedAt?new Date(t.completedAt):((t.date&&/^\d{4}-\d{2}-\d{2}$/.test(t.date))?new Date(t.date+'T12:00:00'):null);
  if(!d||isNaN(d))return 'Unknown';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  if(key==='Unknown')return 'Older / unknown date';
  const [y,m]=key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function renderCompletedGrouped(arr,q){
  const groups={};
  arr.forEach(t=>{const k=completedMonthKey(t);(groups[k]||(groups[k]=[])).push(t)});
  const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const current=today().slice(0,7);
  if(!keys.length)return '<div class="empty">No completed tasks.</div>';
  return keys.map(k=>{
    const openAttr=(k===current||q)?' open':'';
    return `<details class="completed-month"${openAttr}>
      <summary><span>${monthLabel(k)}</span><span class="completed-month-count">${groups[k].length} completed</span></summary>
      <div class="completed-month-body">${groups[k].map(taskCard).join('')}</div>
    </details>`;
  }).join('');
}

function renderTasks(){
  let f=window.taskFilter||'Open', q=window.taskQ||'', pri=window.taskPri||'', special=window.taskSpecial||'';
  let arr=[...data.tasks].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  if(f==='Open')arr=arr.filter(t=>t.status!=='Completed'); else if(f!=='All')arr=arr.filter(t=>t.status===f);
  if(special==='overdue')arr=arr.filter(t=>t.status!=='Completed'&&t.date&&t.date<today());
  if(special==='today')arr=arr.filter(t=>t.status!=='Completed'&&t.date===today());
  if(special==='month')arr=arr.filter(t=>(t.date||'').startsWith(today().slice(0,7)));
  if(q)arr=arr.filter(t=>taskMatches(t,q));
  if(pri)arr=arr.filter(t=>t.priority===pri);

  let chips=['Open','Pending','In Progress','Completed','All'].map(x=>`<button class="small-btn ${f===x&&!special?'primary':'soft'}" onclick="window.taskFilter='${x}';window.taskSpecial='';window.taskPri='';renderTasks()">${x}</button>`).join('');
  let context='';
  if(special==='overdue')context='<div class="card" style="background:#fff2df;border-color:#ffd29a"><b style="color:#c66a00">Overdue tasks</b><div class="meta">Open tasks with a date before today.</div></div>';
  if(special==='today')context='<div class="card" style="background:#eef7ff;border-color:#cfe4fb"><b style="color:#0b63ce">Today</b><div class="meta">Tasks scheduled for today.</div></div>';
  if(special==='month')context='<div class="card" style="background:#eef5ff;border-color:#cbdcff"><b style="color:#315f9b">Tasks this month</b></div>';
  if(pri==='Urgent')context='<div class="card" style="background:#feecec;border-color:#f6bcbc"><b style="color:#c62828">Urgent tasks</b></div>';

  const body=(f==='Completed'&&!special)
    ? renderCompletedGrouped(arr,q)
    : (arr.length?arr.map(taskCard).join(''):'<div class="empty">No tasks here.</div>');

  document.getElementById('view').innerHTML=
    `${context}
    <input id="taskSearchInput" class="search" placeholder="🔍 Search task, apartment, building, status..." value="${esc(q)}" oninput="scheduleTaskSearch(this)">
    <div class="filters"><select onchange="window.taskPri=this.value;window.taskSpecial='';renderTasks()"><option value="">All priorities</option><option ${pri==='Urgent'?'selected':''}>Urgent</option><option ${pri==='High'?'selected':''}>High</option><option ${pri==='Normal'?'selected':''}>Normal</option></select></div>
    <div class="row" style="overflow:auto;margin-bottom:12px">${chips}</div>
    ${body}`;
}

  const b=bld(buildingId); if(!b)return;
  const apartmentIds=data.apartments.filter(a=>a.buildingId===buildingId).map(a=>a.id);
  const linkedTasks=data.tasks.filter(t=>apartmentIds.includes(t.apartmentId));
  const msg='Delete building “'+b.name+'” and its '+apartmentIds.length+' apartment(s)?\n\nLinked tasks, photos, purchases and quotations for those apartments will also be deleted. This cannot be undone.';
  if(!confirm(msg))return;
  rememberDeletedMGVBuilding(buildingId);
  apartmentIds.forEach(rememberDeletedMGVApartment);
  const taskIds=new Set(linkedTasks.map(t=>t.id));
  data.buildings=data.buildings.filter(x=>x.id!==buildingId);
  data.apartments=data.apartments.filter(a=>!apartmentIds.includes(a.id));
  data.tasks=data.tasks.filter(t=>!apartmentIds.includes(t.apartmentId));
  data.photos=data.photos.filter(p=>!taskIds.has(p.taskId) && !apartmentIds.includes(p.apartmentId));
  data.purchases=data.purchases.filter(p=>!taskIds.has(p.taskId) && !apartmentIds.includes(p.apartmentId));
  data.quotations=data.quotations.filter(q=>!taskIds.has(q.taskId) && !apartmentIds.includes(q.apartmentId));
  closeSheet();save();route='properties';selected=null;render();
}

function importMGVQuote(){
  try{
    let raw=localStorage.getItem('mgv_airbnb_quote_transfer');
    if(!raw)return false;
    let tr=JSON.parse(raw);
    if(!tr||!tr.taskId||!tr.quote)return false;
    if((data.quotations||[]).some(q=>q.externalId===tr.quote.id)){localStorage.removeItem('mgv_airbnb_quote_transfer');return false}
    let q=tr.quote;
    let items=(q.lines||[]).map(l=>({description:l.name,qty:Number(l.qty||1),price:(Number(l.labor||0)+Number(l.materials||0))/Math.max(1,Number(l.qty||1))}));
    let itemSubtotal=items.reduce((s,x)=>s+Number(x.qty||1)*Number(x.price||0),0);
    if(Number(q.net||0)>itemSubtotal+0.005)items.push({description:'Minimum visit / service charge',qty:1,price:Number(q.net)-itemSubtotal});
    data.quotations.push({
      id:id(),externalId:q.id,taskId:tr.taskId,apartmentId:tr.apartmentId,
      number:q.quoteNo||'',date:q.date||today(),status:'Sent',
      vat:Number(q.net||0)?(Number(q.vat||0)/Number(q.net||0)*100):24,
      title:'MGV Pricing — '+((q.lines||[]).map(x=>x.name).join(', ')||'Repair / Partial Renovation'),
      items,notes:'Imported automatically from MGV Pricing'
    });
    save();localStorage.removeItem('mgv_airbnb_quote_transfer');
    return tr.taskId;
  }catch(e){return false}
}

async function storePhotos(files,taskId,type){
  data.photos=data.photos||[];
  for(let file of files){
    try{
      let dataUrl=await resizeImage(file,1400,.78);
      data.photos.push({id:id(),taskId,type,dataUrl,name:file.name||'photo.jpg',createdAt:Date.now()});
    }catch(e){alert('Could not add one of the photos.')}
  }
  try{save()}catch(e){
    alert('Storage is full. Export a backup and remove some old photos.');
  }
}
function resizeImage(file,maxSize,quality){
  return new Promise((resolve,reject)=>{
    let fr=new FileReader(), img=new Image();
    fr.onerror=reject;
    fr.onload=()=>img.src=fr.result;
    img.onerror=reject;
    img.onload=()=>{
      let scale=Math.min(1,maxSize/Math.max(img.width,img.height));
      let c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
      let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    fr.readAsDataURL(file);
  })
}

function pdfWrapLines(ctx,text,maxWidth){
  text=String(text||'');
  const words=text.split(/\s+/), lines=[];let line='';
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test;
  }
  if(line)lines.push(line);
  return lines.length?lines:[''];
}
function pdfDrawWrapped(ctx,text,x,y,maxWidth,lineHeight){
  const lines=pdfWrapLines(ctx,text,maxWidth);
  lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
  return y+lines.length*lineHeight;
}
function pdfLoadImage(src){
  return new Promise(resolve=>{
    if(!src){resolve(null);return}
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}
function pdfAddJpegPages(jpegs){
  const enc=new TextEncoder();
  const chunks=[];
  let length=0;
  const offsets=[0];
  function pushString(s){
    const b=enc.encode(s);chunks.push(b);length+=b.length;
  }
  function pushBytes(b){chunks.push(b);length+=b.length}
  function addObj(num,bodyParts){
    offsets[num]=length;
    pushString(num+' 0 obj\n');
    for(const part of bodyParts){
      if(typeof part==='string')pushString(part); else pushBytes(part);
    }
    pushString('\nendobj\n');
  }

  pushString('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const pageCount=jpegs.length;
  const pageNums=[], imageNums=[], contentNums=[];
  let next=3;
  for(let i=0;i<pageCount;i++){
    pageNums.push(next++); imageNums.push(next++); contentNums.push(next++);
  }
  addObj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  addObj(2,[`<< /Type /Pages /Count ${pageCount} /Kids [${pageNums.map(n=>n+' 0 R').join(' ')}] >>`]);

  for(let i=0;i<pageCount;i++){
    const jpeg=jpegs[i];
    const imgBytes=jpeg.bytes;
    const pageW=595.28,pageH=841.89;
    addObj(imageNums[i],[`<< /Type /XObject /Subtype /Image /Width ${jpeg.width} /Height ${jpeg.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`,imgBytes,'\nendstream']);
    const stream=`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
    const sb=enc.encode(stream);
    addObj(contentNums[i],[`<< /Length ${sb.length} >>\nstream\n`,sb,'endstream']);
    addObj(pageNums[i],[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 ${imageNums[i]} 0 R >> >> /Contents ${contentNums[i]} 0 R >>`]);
  }

  const xref=length;
  const total=next;
  pushString(`xref\n0 ${total}\n`);
  pushString('0000000000 65535 f \n');
  for(let i=1;i<total;i++)pushString(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');
  pushString(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);

  const out=new Uint8Array(length);let pos=0;
  chunks.forEach(c=>{out.set(c,pos);pos+=c.length});
  return out;
}
async function buildDailyReportPdf(date){
  const tasks=(data.tasks||[]).filter(t=>t.date===date);
  const inspections=(data.inspections||[]).filter(i=>i.date===date);
  const completed=tasks.filter(t=>t.status==='Completed').length;
  const open=tasks.filter(t=>t.status!=='Completed').length;
  const urgent=tasks.filter(t=>t.priority==='Urgent').length;
  const issues=inspections.reduce((n,i)=>n+(i.issues||[]).length,0);

  const W=1240,H=1754,M=75;
  const pages=[];
  function newPage(){
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.textBaseline='top';ctx.fillStyle='#0f172a';
    return {c,ctx,y:M};
  }
  let pg=newPage();

  function header(title,subtitle){
    const {ctx}=pg;
    ctx.fillStyle='#0b63ce';ctx.fillRect(0,0,W,150);
    ctx.fillStyle='#fff';ctx.font='700 42px Arial, sans-serif';ctx.fillText(title,M,35);
    ctx.font='24px Arial, sans-serif';ctx.fillText(subtitle,M,92);
    pg.y=190;
  }
  function ensure(space){
    if(pg.y+space>H-M){
      pages.push(pg.c);pg=newPage();header('Airbnb Maintenance — Daily Report',fmt(date));
    }
  }
  function drawSectionTitle(text){
    ensure(70);
    pg.ctx.fillStyle='#0f172a';pg.ctx.font='700 34px Arial, sans-serif';
    pg.ctx.fillText(text,M,pg.y);pg.y+=55;
  }
  function drawText(label,value){
    if(value===undefined||value===null||value==='')return;
    const ctx=pg.ctx;ctx.font='700 24px Arial, sans-serif';ctx.fillStyle='#334155';
    const labelW=ctx.measureText(label+': ').width;
    ctx.fillText(label+': ',M,pg.y);
    ctx.font='24px Arial, sans-serif';ctx.fillStyle='#0f172a';
    pg.y=pdfDrawWrapped(ctx,String(value),M+labelW,pg.y,W-M*2-labelW,32)+8;
  }
  function drawPill(text,bg,fg,x,y){
    const ctx=pg.ctx;ctx.font='700 21px Arial, sans-serif';
    const w=ctx.measureText(text).width+36;
    ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,y,w,42,21);ctx.fill();
    ctx.fillStyle=fg;ctx.fillText(text,x+18,y+9);
    return w;
  }
  async function drawPhoto(src){
    const img=await pdfLoadImage(src);if(!img)return;
    const maxW=W-M*2, maxH=520;
    const scale=Math.min(maxW/img.width,maxH/img.height,1.6);
    const dw=img.width*scale,dh=img.height*scale;
    ensure(dh+30);
    pg.ctx.drawImage(img,M,pg.y,dw,dh);pg.y+=dh+25;
  }
  async function drawTask(t,index){
    ensure(220);
    const loc=dailyLocation(t.apartmentId),ctx=pg.ctx;
    ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.roundRect(M-18,pg.y-12,W-M*2+36,150,18);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.font='700 30px Arial, sans-serif';
    pg.y=pdfDrawWrapped(ctx,(index+1)+'. '+(t.title||'Task'),M,pg.y,W-M*2,38)+6;
    ctx.font='22px Arial, sans-serif';ctx.fillStyle='#64748b';
    pg.y=pdfDrawWrapped(ctx,loc.label+(loc.a?.floor?' • Floor '+loc.a.floor:'')+(t.category?' • '+t.category:''),M,pg.y,W-M*2,30)+10;
    let x=M;
    const status=t.status||'Pending';
    x+=drawPill(status,status==='Completed'?'#dcfce7':status==='In Progress'?'#dff0ff':'#fff4d6',status==='Completed'?'#166534':status==='In Progress'?'#075c9e':'#805d00',x,pg.y)+10;
    const pr=t.priority||'Normal';
    drawPill(pr,pr==='Urgent'?'#fee2e2':pr==='High'?'#ffedd5':'#dbeafe',pr==='Urgent'?'#b91c1c':pr==='High'?'#c2410c':'#1d4ed8',x,pg.y);
    pg.y+=58;
    drawText('Description',t.description);drawText('Notes',t.notes);drawText('Materials',t.materials);
    if(t.cost)drawText('Cost','€'+t.cost);
    if(t.assignedTo)drawText('Assigned to',t.assignedTo);
    const ps=dailyTaskPhotos(t.id);
    for(const ph of ps)await drawPhoto(ph.dataUrl);
    pg.y+=20;
  }
  async function drawInspection(ins,index){
    ensure(180);
    const loc=dailyLocation(ins.apartmentId),ctx=pg.ctx;
    ctx.fillStyle='#eef5ff';ctx.beginPath();ctx.roundRect(M-18,pg.y-12,W-M*2+36,120,18);ctx.fill();
    ctx.fillStyle='#0f172a';ctx.font='700 30px Arial, sans-serif';
    pg.y=pdfDrawWrapped(ctx,`Inspection ${index+1} — ${loc.label||'Apartment'}`,M,pg.y,W-M*2,38)+6;
    ctx.font='22px Arial, sans-serif';ctx.fillStyle='#64748b';
    ctx.fillText(`${(ins.issues||[]).length} problem(s) • ${ins.status||'Open'}`,M,pg.y);pg.y+=45;
    for(const issue of (ins.issues||[])){
      ensure(170);
      ctx.fillStyle='#fff1f2';ctx.beginPath();ctx.roundRect(M,pg.y-8,W-M*2,110,14);ctx.fill();
      ctx.fillStyle='#b91c1c';ctx.font='700 26px Arial, sans-serif';
      pg.y=pdfDrawWrapped(ctx,'⚠ '+(issue.title||'Problem'),M+18,pg.y,W-M*2-36,34)+4;
      if(issue.note){ctx.fillStyle='#0f172a';ctx.font='23px Arial, sans-serif';pg.y=pdfDrawWrapped(ctx,issue.note,M+18,pg.y,W-M*2-36,31)+8}
      const phs=dailyInspectionPhotos(issue);
      for(const ph of phs)await drawPhoto(ph.dataUrl);
      pg.y+=14;
    }
  }

  header('Airbnb Maintenance — Daily Report',fmt(date));
  pg.ctx.fillStyle='#0f172a';pg.ctx.font='700 30px Arial, sans-serif';
  pg.ctx.fillText('Summary',M,pg.y);pg.y+=52;
  const summary=[
    ['Tasks',tasks.length],['Completed',completed],['Open',open],
    ['Urgent',urgent],['Inspections',inspections.length],['Problems found',issues]
  ];
  const boxW=(W-M*2-30)/3,boxH=115;
  summary.forEach((s,i)=>{
    const col=i%3,row=Math.floor(i/3),x=M+col*(boxW+15),y=pg.y+row*(boxH+15);
    pg.ctx.fillStyle='#f8fbff';pg.ctx.strokeStyle='#cbd5e1';pg.ctx.lineWidth=2;
    pg.ctx.beginPath();pg.ctx.roundRect(x,y,boxW,boxH,18);pg.ctx.fill();pg.ctx.stroke();
    pg.ctx.fillStyle='#0b63ce';pg.ctx.font='700 34px Arial, sans-serif';pg.ctx.fillText(String(s[1]),x+18,y+18);
    pg.ctx.fillStyle='#64748b';pg.ctx.font='20px Arial, sans-serif';pg.ctx.fillText(s[0],x+18,y+64);
  });
  pg.y+=2*(boxH+15)+25;

  drawSectionTitle('Works');
  if(!tasks.length){pg.ctx.font='24px Arial, sans-serif';pg.ctx.fillStyle='#64748b';pg.ctx.fillText('No tasks recorded for this date.',M,pg.y);pg.y+=50}
  for(let i=0;i<tasks.length;i++)await drawTask(tasks[i],i);

  drawSectionTitle('Inspections');
  if(!inspections.length){pg.ctx.font='24px Arial, sans-serif';pg.ctx.fillStyle='#64748b';pg.ctx.fillText('No inspections recorded for this date.',M,pg.y);pg.y+=50}
  for(let i=0;i<inspections.length;i++)await drawInspection(inspections[i],i);

  pages.push(pg.c);

  const jpegs=[];
  for(const c of pages){
    const dataUrl=c.toDataURL('image/jpeg',0.86);
    const b64=dataUrl.split(',')[1],bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    jpegs.push({bytes,width:c.width,height:c.height});
  }
  return pdfAddJpegPages(jpegs);
}
async function saveDailyReportPdf(date){

  else{try{await navigator.clipboard.writeText(text);alert('Report summary copied.')}catch(e){alert(text)}}

async function buildClientReportPdf(taskId){
  const t=data.tasks.find(x=>x.id===taskId);if(!t)throw new Error('Task not found');
  const a=apt(t.apartmentId),b=a?.buildingId?bld(a.buildingId):null;
  const ps=(data.photos||[]).filter(p=>p.taskId===taskId);
  const related=taskInspectionIssues(taskId,t.apartmentId,t.date);

  const W=1240,H=1754,M=76,CONTENT=W-M*2;
  const pages=[];let pageNo=0;
  function newPage(){const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='top';pageNo++;return{c,ctx,y:70}}
  let pg=newPage();
  function header(){
    const ctx=pg.ctx;
    ctx.fillStyle='#0b63ce';ctx.fillRect(0,0,W,150);
    ctx.fillStyle='#fff';ctx.font='700 42px Arial, sans-serif';ctx.fillText('MGV MyGreekVacations',M,28);
    ctx.font='22px Arial, sans-serif';ctx.fillText('Maintenance & Property Services',M,84);
    ctx.font='700 26px Arial, sans-serif';ctx.fillText('CLIENT SERVICE REPORT',W-M-330,38);
    ctx.font='20px Arial, sans-serif';ctx.fillText(fmt(t.date),W-M-330,82);
    pg.y=190;
  }
  function footer(){
    const ctx=pg.ctx;ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M,H-58);ctx.lineTo(W-M,H-58);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='17px Arial, sans-serif';ctx.fillText('Generated by Airbnb Repairs Manager',M,H-42);
    const txt='Page '+pageNo;ctx.fillText(txt,W-M-ctx.measureText(txt).width,H-42);
  }
  function finish(){footer();pages.push(pg.c)}
  function ensure(space){if(pg.y+space>H-92){finish();pg=newPage();header()}}
  function line(label,value){
    if(value===undefined||value===null||value==='')return;
    ensure(55);
    const ctx=pg.ctx;ctx.font='700 22px Arial, sans-serif';ctx.fillStyle='#334155';ctx.fillText(label+':',M,pg.y);
    ctx.font='22px Arial, sans-serif';ctx.fillStyle='#0f172a';
    pg.y=pdfDrawWrapped(ctx,String(value),M+240,pg.y,CONTENT-240,30)+9;
    ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(M,pg.y);ctx.lineTo(W-M,pg.y);ctx.stroke();pg.y+=9;
  }
  function section(text){ensure(70);pg.ctx.fillStyle='#0f172a';pg.ctx.font='700 30px Arial, sans-serif';pg.ctx.fillText(text,M,pg.y);pg.y+=50}
  async function photo(src){
    const img=await pdfLoadImage(src);if(!img)return;
    const maxW=CONTENT,maxH=430,scale=Math.min(maxW/img.width,maxH/img.height,1.5),dw=img.width*scale,dh=img.height*scale;
    ensure(dh+30);pg.ctx.drawImage(img,M,pg.y,dw,dh);pg.y+=dh+24;
  }

  header();
  line('Building',b?.name||'');
  line('Apartment',a?.name||'');
  line('Address',a?.address||'');
  line('Work',t.title||'');
  line('Category',t.category||'');
  line('Status',t.status||'');
  line('Priority',t.priority||'Normal');
  line('Description',t.description||'');
  line('Materials',t.materials||'');
  if(t.cost)line('Recorded cost','€'+t.cost);
  line('Notes',t.notes||'');

  if(related.length){
    section('Inspection Findings');
    for(const {issue} of related){
      ensure(120);
      pg.ctx.fillStyle='#fff7f7';pg.ctx.strokeStyle='#f3cccc';pg.ctx.lineWidth=2;
      pg.ctx.beginPath();pg.ctx.roundRect(M,pg.y,CONTENT,100,14);pg.ctx.fill();pg.ctx.stroke();
      pg.ctx.fillStyle='#b91c1c';pg.ctx.font='700 24px Arial, sans-serif';
      pg.y=pdfDrawWrapped(pg.ctx,'⚠ '+(issue.title||'Problem'),M+18,pg.y+14,CONTENT-36,31)+2;
      if(issue.note){pg.ctx.fillStyle='#0f172a';pg.ctx.font='21px Arial, sans-serif';pg.y=pdfDrawWrapped(pg.ctx,issue.note,M+18,pg.y,CONTENT-36,29)+6}
      const phs=dailyInspectionPhotos(issue);for(const ph of phs)await photo(ph.dataUrl);
      pg.y+=12;
    }
  }

  if(ps.length){
    section('Work Photos');
    for(const ph of ps)await photo(ph.dataUrl);
  }

  ensure(160);
  pg.y+=45;
  pg.ctx.strokeStyle='#64748b';pg.ctx.beginPath();pg.ctx.moveTo(M,pg.y);pg.ctx.lineTo(M+380,pg.y);pg.ctx.stroke();
  pg.ctx.beginPath();pg.ctx.moveTo(W-M-380,pg.y);pg.ctx.lineTo(W-M,pg.y);pg.ctx.stroke();
  pg.ctx.fillStyle='#64748b';pg.ctx.font='18px Arial, sans-serif';
  pg.ctx.fillText('Technician / Maintenance',M+70,pg.y+10);
  pg.ctx.fillText('Client / Property Representative',W-M-340,pg.y+10);

  finish();

  const jpegs=[];
  for(const c of pages){
    const dataUrl=c.toDataURL('image/jpeg',0.88),b64=dataUrl.split(',')[1],bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    jpegs.push({bytes,width:c.width,height:c.height});
  }
  return pdfAddJpegPages(jpegs);
}
async function saveClientReportPdf(taskId){

    const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');

}

function nextRecurrenceDate(date,recurrence){
  if(!date||!recurrence||recurrence==='None')return '';
  const d=new Date(date+'T12:00:00');
  if(isNaN(d))return '';
  if(recurrence==='Weekly')d.setDate(d.getDate()+7);
  else if(recurrence==='Monthly')d.setMonth(d.getMonth()+1);
  else if(recurrence==='Every 3 months')d.setMonth(d.getMonth()+3);
  else if(recurrence==='Every 6 months')d.setMonth(d.getMonth()+6);
  else if(recurrence==='Yearly')d.setFullYear(d.getFullYear()+1);
  else return '';
  return d.toISOString().slice(0,10);
}
function createNextRecurringTask(t){
  if(!t||!t.recurrence||t.recurrence==='None'||t.nextRecurringCreated)return null;
  const nextDate=nextRecurrenceDate(t.date,t.recurrence);
  if(!nextDate)return null;
  const copy={...t,id:id(),date:nextDate,status:'Pending',createdAt:Date.now()};
  delete copy.completedAt;
  delete copy.nextRecurringCreated;
  data.tasks.push(copy);
  t.nextRecurringCreated=copy.id;
  return copy;
}

function completeTask(i){
  let t=data.tasks.find(x=>x.id===i);if(!t)return;
  t.status='Completed';t.completedAt=Date.now();
  const next=createNextRecurringTask(t);
  save();render();showTask(i);
  if(next)alert('Recurring maintenance: next task created for '+fmt(next.date)+'.');
}

function importBackup(file){
  if(!file)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let raw=String(r.result||'').replace(/^\uFEFF/,'').trim();
      if(!raw)throw new Error('Empty file');
      let parsed=JSON.parse(raw);
      let d=(parsed&&parsed.data&&typeof parsed.data==='object')?parsed.data:parsed;
      if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Invalid structure');
      d.buildings=Array.isArray(d.buildings)?d.buildings:[];
      d.apartments=Array.isArray(d.apartments)?d.apartments:[];
      d.tasks=Array.isArray(d.tasks)?d.tasks:[];
      d.photos=Array.isArray(d.photos)?d.photos:[];
      d.purchases=Array.isArray(d.purchases)?d.purchases:[];
      d.quotations=Array.isArray(d.quotations)?d.quotations:[];
      d.favorites=Array.isArray(d.favorites)?d.favorites:[];
      d.inspections=Array.isArray(d.inspections)?d.inspections:[];
      if(confirm('Restore this backup and replace the current local data?')){
        data=d;save();render();alert('Backup restored successfully.');
      }
    }catch(e){
      alert('Invalid backup file. Please select a JSON backup created by Airbnb Repairs.');
    }
  };
  r.onerror=()=>alert('Could not read the selected backup file.');
  r.readAsText(file,'UTF-8');
}
